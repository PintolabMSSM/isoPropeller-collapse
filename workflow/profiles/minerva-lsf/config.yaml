# --- Define basic settings --- #
executor:           lsf
scheduler:          greedy
jobs:               100
latency-wait:       5
rerun-incomplete:   true
use-singularity:    true
use-conda:          true
retries:            1

# --- Define default resources for all rules --- #
default-resources:
  lsf_queue:    "express"
  lsf_project:  "acc_EPIASD"
  mem_mb:       50000
  runtime:      720
  threads:      4
  span:         "span[hosts=1]"
  lsf_extra:    "-oo clusterlogs/%J.OU"

# --- Define rule-specific resources --- #
set-resources:

  bam_to_fasta:
    mem_mb:     16000
    runtime:    360

  mapping:
    mem_mb:     96000

  run_isopropeller:
    lsf_queue:  "express"
    mem_mb:     300000
    runtime:    720

  merge_isopropeller_gtfs:
    lsf_queue:  "premium"
    mem_mb:     1000000
    runtime:    1440

  analyze_end_regions:
    lsf_queue:  "premium"
    mem_mb:     1000000
    runtime:    1440

  qc_genotyping_snps:
    lsf_queue:  "premium"
    mem_mb:     64000
    runtime:    1440

  mapping_pbfusion:
    mem_mb:     64000

  oarfish_index:
    mem_mb:     50000

  oarfish_quant_sample:
    mem_mb:     64000

  filter_repeat_region_overlap:
    mem_mb:     200000

  filter_par_region_overlap:
    mem_mb:     200000

  isopropeller_defrag:
    mem_mb:     200000

  isopropeller_defrag_prune:
    lsf_queue:  "premium"
    mem_mb:     200000
    runtime:    1440
